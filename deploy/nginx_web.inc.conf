error_page 404 /404.html;

location = /404.html {
    root /opt/ryadom56/web;
}

# Кэш картинок и стилей визитки. HTML и /api не трогаем.
location ~* ^/(?:styles\.css|app\.js|favicon[^/]*|icon-512\.png|og\.jpg|qr\.svg|flyer\.jpg|shots/|install/) {
    root /opt/ryadom56/web;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
    try_files $uri =404;
}

# Фрагмент внутрь server { } Рядом56.
# Визитка: root /opt/ryadom56/web. Админка: /console/ → admin/dist (симлинк web/console).
# WebSocket /api/calls/ws сюда не копировать — его ставит деплой звонков, иначе nginx упадёт на дубле.

location = / {
    if ($arg_l ~ "^[0-9]+$") {
        return 302 /l/$arg_l;
    }
    root /opt/ryadom56/web;
    try_files /index.html =404;
}

location = /console {
    return 301 /console/;
}

location /console/ {
    root /opt/ryadom56/web;
    try_files $uri $uri/ /console/index.html;
}

location /legal/ {
    proxy_pass http://127.0.0.1:8001/legal/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /l/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Старые закладки, когда админка была на корне
location ~ ^/(moderation|reports|audit|errors|directory|events|calendar|transport|news|alerts|chats|blacklist|users|app-update|calls)(/|$) {
    return 302 /console$request_uri;
}
