name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mobile
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=true -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Local gradle.properties uses tiny heap/metaspace so Windows does not freeze.
      # CI has enough RAM for Firebase (firebase_core javac died with Metaspace).
      - name: Raise Gradle memory for CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/gradle.properties")
          lines = []
          for line in p.read_text(encoding="utf-8").splitlines():
              if line.startswith("org.gradle.jvmargs="):
                  lines.append(
                      "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
                  )
              elif line.startswith("org.gradle.daemon="):
                  lines.append("org.gradle.daemon=true")
              elif line.startswith("org.gradle.workers.max="):
                  lines.append("org.gradle.workers.max=2")
              else:
                  lines.append(line)
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch flutter_webrtc compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [
              Path.home() / ".pub-cache" / "hosted" / "pub.dev",
              Path("/home/runner/.pub-cache/hosted/pub.dev"),
          ]
          n = 0
          for root in roots:
              if not root.is_dir():
                  continue
              for p in list(root.glob("flutter_webrtc-*/android/build.gradle")) + list(root.glob("flutter_webrtc-*/android/build.gradle.kts")):
                  text = p.read_text(encoding="utf-8")
                  new = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 36", text)
                  new = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 36", new)
                  if new != text:
                      p.write_text(new, encoding="utf-8")
                      n += 1
                      print("patched", p)
          print("patched_files", n)
          PY

      # Без key.properties Gradle подписывает debug-ключом — такой APK нельзя
      # ставить поверх production (останется «второе» приложение). Секреты:
      # ANDROID_KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD.
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 — APK will be debug-signed (do not use for OTA updates)"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/ryadom56-release.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=ryadom56-release.jks"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons --dart-define=API_BASE=https://legac.ru/api

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ryadom56-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
